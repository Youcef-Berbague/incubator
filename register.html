<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <!-- font awesome  -->
  <link rel="stylesheet" href="/css/all.min.css" />
  <!-- globale rules -->
  <link rel="stylesheet" href="/css/globaleRules.css" />
  <!-- normalizing -->
  <link rel="stylesheet" href="/css/normalize.css" />
  <!-- styling file  -->
  <link rel="stylesheet" href="/css/register.css" />
  <!-- google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="header">
    <div class="container">
      <div class="incubator-logo">
        <a href="/">
          <img src="/img/home-page/incubator-logo.png" alt="" />
          <span>حاضنة الجامعة</span>
        </a>
      </div>
      <div class="nav">
        <ul>
          <li><a href="/">الصفحة الرئيسية</a></li>
          <li>
            <button>الخدمات <i class="fa-solid fa-angle-down"></i></button>
          </li>
          <li>
            <button>الأحداث <i class="fa-solid fa-angle-down"></i></button>
          </li>
          <li><button>التواصل</button></li>
          <li>
            <button>العربية <i class="fa-solid fa-angle-down"></i></button>
          </li>
          <li>
            <button><i class="fa-solid fa-user"></i> تسجيل الدخول</button>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="registration">
    <div class="container">
      <form action="" method="post">
        <div class="form-header">
          <h2>لتسجيل مشروعك</h2>
          <p>قم بملئ البيانات التالية:</p>
        </div>
        <div class="form-body">
          <div class="input-group">
            <label for="project-title">عنوان المشروع:</label>
            <input type="text" id="project-title" name="project-title" placeholder="project title" required />
          </div>
          <div class="input-group">
            <p>عدد الطلاب:</p>
            <div class="number-of-students">
              <label for="one-student">1</label>
              <input type="radio" id="one-student" name="number-of-students" value="1" required checked />
            </div>
            <div class="number-of-students">
              <label for="two-students">2</label>
              <input type="radio" id="two-students" name="number-of-students" value="2" />
            </div>
            <div class="number-of-students">
              <label for="three-students">3</label>
              <input type="radio" id="three-students" name="number-of-students" value="3" />
            </div>
            <div class="number-of-students">
              <label for="four-students">4</label>
              <input type="radio" id="four-students" name="number-of-students" value="4" />
            </div>
            <div class="number-of-students">
              <label for="five-students">5</label>
              <input type="radio" id="five-students" name="number-of-students" value="5" />
            </div>
            <div class="number-of-students">
              <label for="six-students">6</label>
              <input type="radio" id="six-students" name="number-of-students" value="6" />
            </div>
          </div>
          <div class="input-group cards">
            <p>بيانات الطلاب:</p>
            <div class="students-info"></div>
          </div>
          <div class="input-group">
            <p>عدد الأساتذة المشرفين:</p>
            <div class="number-of-supervisors">
              <label for="one-supervisor">1</label>
              <input type="radio" id="one-supervisor" name="number-of-supervisors" value="1" required checked />
            </div>
            <div class="number-of-supervisors">
              <label for="two-supervisor">2</label>
              <input type="radio" id="two-supervisor" name="number-of-supervisors" value="2" required />
            </div>
            <div class="number-of-supervisors">
              <label for="three-supervisor">3</label>
              <input type="radio" id="three-supervisor" name="number-of-supervisors" value="3" required />
            </div>
          </div>
          <div class="input-group cards">
            <p>بيانات الاساتذة المشرفين:</p>
            <div class="supervisors-info"></div>
          </div>
          <div class="input-group faculties">
            <p>الكلية:</p>
            <div class="faculty">
              <label for="tech-faculty">كلية التكنولوجيا</label>
              <input type="radio" id="tech-faculty" name="faculty" value="tech" required checked />
            </div>
            <div class="faculty">
              <label for="science-faculty">كلية العلوم</label>
              <input type="radio" id="science-faculty" name="faculty" value="science" required />
            </div>
            <div class="faculty">
              <label for="earth-faculty">كلية علوم الأرض</label>
              <input type="radio" id="earth-faculty" name="faculty" value="earth" required />
            </div>
            <div class="faculty">
              <label for="humanSocial-faculty">كلية العلوم الانسانية والاجتماعية</label>
              <input type="radio" id="humanSocial-faculty" name="faculty" value="humanSocial" required />
            </div>
            <div class="faculty">
              <label for="literateur-faculty">كلية الاداب واللغات</label>
              <input type="radio" id="literateur-faculty" name="faculty" value="literateur" required />
            </div>
            <div class="faculty">
              <label for="law-faculty">كلية الحقوق والعلوم السياسية</label>
              <input type="radio" id="law-faculty" name="faculty" value="law" required />
            </div>
            <div class="faculty">
              <label for="gestion-faculty">كلية علوم الاقتصاد والتسيير</label>
              <input type="radio" id="gestion-faculty" name="faculty" value="gestion" required />
            </div>
            <div class="faculty">
              <label for="medcine-faculty">كلية الطب</label>
              <input type="radio" id="medcine-faculty" name="faculty" value="medcine" required />
            </div>
          </div>
          <div class="input-group faculties-cards">
            <p>القسم:</p>
            <div class="tech-faculty card active">
              <div class="departement">
                <label for="tronCST1-dep">سنة أولى جذع مشترك علوم وتكنولوجيا</label>
                <input type="radio" id="tronCST1-dep" name="departement" value="tronCST1" required checked />
              </div>
              <div class="departement">
                <label for="tronCST2-dep">سنة ثانية جذع مشترك علوم وتكنولوجيا</label>
                <input type="radio" id="tronCST2-dep" name="departement" value="tronCST2" required />
              </div>
              <div class="departement">
                <label for="electronic-dep">قسم الإلكترونيات</label>
                <input type="radio" id="electronic-dep" name="departement" value="electronic" required />
              </div>
              <div class="departement">
                <label for="electroMecha-dep">قسم الكهروميكانيك</label>
                <input type="radio" id="electroMecha-dep" name="departement" value="electroMecha" required />
              </div>
              <div class="departement">
                <label for="electroTech-dep">قسم الكهروتقني</label>
                <input type="radio" id="electroTech-dep" name="departement" value="electroTech" required />
              </div>
              <div class="departement">
                <label for="CS-dep">قسم علوم الكمبيوتر</label>
                <input type="radio" id="CS-dep" name="departement" value="CS" required />
              </div>
              <div class="departement">
                <label for="civilEng-dep">قسم الهندسة المدنية</label>
                <input type="radio" id="civilEng-dep" name="departement" value="civilEng" required />
              </div>
              <div class="departement">
                <label for="metal-dep">قسم هندسة المعادن والمواد</label>
                <input type="radio" id="metal-dep" name="departement" value="metal" required />
              </div>
              <div class="departement">
                <label for="procEng-dep">قسم هندسة العمليات</label>
                <input type="radio" id="procEng-dep" name="departement" value="procEng" required />
              </div>
              <div class="departement">
                <label for="mechaEng-dep">قسم الهندسة الميكانيكية</label>
                <input type="radio" id="mechaEng-dep" name="departement" value="mechaEng" required />
              </div>
              <div class="departement">
                <label for="hydro-dep">قسم الهيدروليك</label>
                <input type="radio" id="hydro-dep" name="departement" value="hydro" required />
              </div>
            </div>
            <div class="science-faculty card">
              <div class="departement">
                <label for="math-dep">قسم الرياضيات</label>
                <input type="radio" id="math-dep" name="departement" value="math" required />
              </div>
              <div class="departement">
                <label for="physic-dep">قسم الفيزياء</label>
                <input type="radio" id="physic-dep" name="departement" value="physic" required />
              </div>
              <div class="departement">
                <label for="chemistry-dep">قسم الكيمياء</label>
                <input type="radio" id="chemistry-dep" name="departement" value="chemistry" required />
              </div>
              <div class="departement">
                <label for="bioChemi-dep">قسم الكيمياء الحيوية</label>
                <input type="radio" id="bioChemi-dep" name="departement" value="bioChemi" required />
              </div>
              <div class="departement">
                <label for="biologie-dep">قسم علم الأحياء</label>
                <input type="radio" id="biologie-dep" name="departement" value="biologie" required />
              </div>
              <div class="departement">
                <label for="sienceMer-dep">قسم علوم البحار</label>
                <input type="radio" id="sienceMer-dep" name="departement" value="sienceMer" required />
              </div>
              <div class="departement">
                <label for="TCSNV1-dep">سنة اولى جذع مشترك علوم الطبيعة والحياة</label>
                <input type="radio" id="TCSNV1-dep" name="departement" value="TCSNV1" required />
              </div>
              <div class="departement">
                <label for="TCSNV2-dep">سنة ثانية جذع مشترك علوم الطبيعة والحياة</label>
                <input type="radio" id="TCSNV2-dep" name="departement" value="TCSNV2" required />
              </div>
              <div class="departement">
                <label for="TCSM-dep">جذع مشترك علوم المادة</label>
                <input type="radio" id="TCSM-dep" name="departement" value="TCSM" required />
              </div>
            </div>
            <div class="earth-faculty card">
              <div class="departement">
                <label for="territoire-dep">قسم تهيئة الإقليم</label>
                <input type="radio" id="territoire-dep" name="departement" value="territoire" required />
              </div>
              <div class="departement">
                <label for="architect-dep">قسم الهندسة المعمارية</label>
                <input type="radio" id="architect-dep" name="departement" value="architect" required />
              </div>
              <div class="departement">
                <label for="geologie-dep">قسم الجيولوجيا</label>
                <input type="radio" id="geologie-dep" name="departement" value="geologie" required />
              </div>
              <div class="departement">
                <label for="Mines-dep">قسم المناجم</label>
                <input type="radio" id="Mines-dep" name="departement" value="Mines" required />
              </div>
            </div>
            <div class="humanSocial-faculty card">
              <div class="departement">
                <label for="TChumanSocial-dep">جذع مشترك علوم انسانية واجتماعية</label>
                <input type="radio" id="TChumanSocial-dep" name="departement" value="TChumanSocial" required />
              </div>
              <div class="departement">
                <label for="infoEtC-dep">قسم الاعلام والاتصال</label>
                <input type="radio" id="infoEtC-dep" name="departement" value="infoEtC" required />
              </div>
              <div class="departement">
                <label for="biblioEtDocu-dep">قسم علوم المكتبات والتوثيق</label>
                <input type="radio" id="biblioEtDocu-dep" name="departement" value="biblioEtDocu" required />
              </div>
              <div class="departement">
                <label for="histoiArcheo-dep">قسم التاريخ والجغرافيا</label>
                <input type="radio" id="histoiArcheo-dep" name="departement" value="histoiArcheo" required />
              </div>
              <div class="departement">
                <label for="psyOrtho-dep">قسم علم النفس وعلاج النطق</label>
                <input type="radio" id="psyOrtho-dep" name="departement" value="psyOrtho" required />
              </div><div class="departement">
                <label for="socioDemo-dep">قسم علم الاجتماع والديموغرافيا</label>
                <input type="radio" id="socioDemo-dep" name="departement" value="socioDemo" required />
              </div><div class="departement">
                <label for="philosophie-dep">قسم الفلسفة</label>
                <input type="radio" id="philosophie-dep" name="departement" value="philosophie" required />
              </div>
            </div>
            <div class="literateur-faculty card">
              <div class="departement">
                <label for="literArab-dep">قسم الآداب واللغة العربية</label>
                <input type="radio" id="literArab-dep" name="departement" value="literArab" required />
              </div>
              <div class="departement">
                <label for="literFr-dep">قسم الآداب واللغة الفرنسية</label>
                <input type="radio" id="literFr-dep" name="departement" value="literFr" required />
              </div>
              <div class="departement">
                <label for="literEn-dep">قسم الآداب واللغة الإنجليزية</label>
                <input type="radio" id="literEn-dep" name="departement" value="literEn" required />
              </div>
              <div class="departement">
                <label for="literItal-dep">قسم الآداب واللغة الإيطالية</label>
                <input type="radio" id="literItal-dep" name="departement" value="literItal" required />
              </div>
              <div class="departement">
                <label for="traduction-dep">قسم الترجمة والترجمة الفورية</label>
                <input type="radio" id="traduction-dep" name="departement" value="traduction" required />
              </div>
            </div>
            <div class="law-faculty card">
              <div class="departement">
                <label for="publicLaw-dep">قسم القانون العام</label>
                <input type="radio" id="publicLaw-dep" name="departement" value="publicLaw" required />
              </div>
              <div class="departement">
                <label for="privateLaw-dep">قسم القانون الخاص</label>
                <input type="radio" id="privateLaw-dep" name="departement" value="privateLaw" required />
              </div>
              <div class="departement">
                <label for="politics-dep">قسم العلوم السياسية</label>
                <input type="radio" id="politics-dep" name="departement" value="politics" required />
              </div>
            </div>
            <div class="gestion-faculty card">
              <div class="departement">
                <label for="TC-dep">قسم الجذع المشترك</label>
                <input type="radio" id="TC-dep" name="departement" value="TC" required />
              </div>
              <div class="departement">
                <label for="finance-dep">قسم العلوم المالية</label>
                <input type="radio" id="finance-dep" name="departement" value="finance" required />
              </div>
              <div class="departement">
                <label for="management-dep">قسم علوم الإدارة</label>
                <input type="radio" id="management-dep" name="departement" value="management" required />
              </div>
              <div class="departement">
                <label for="economics-dep">قسم العلوم الاقتصادية</label>
                <input type="radio" id="economics-dep" name="departement" value="economics" required />
              </div>
            </div>
            <div class="medcine-faculty card">
              <div class="departement">
                <label for="medcin-dep">قسم الطب</label>
                <input type="radio" id="medcin-dep" name="departement" value="medcin" required />
              </div>
              <div class="departement">
                <label for="pharmacy-dep">قسم الصيدلة</label>
                <input type="radio" id="pharmacy-dep" name="departement" value="pharmacy" required />
              </div>
              <div class="departement">
                <label for="medcinDen-dep">قسم طب الأسنان</label>
                <input type="radio" id="medcinDen-dep" name="departement" value="medcinDen" required />
              </div>
            </div>
          </div>
          <button type="submit">تسجيل</button>
      </form>
    </div>
  </div>
  <script src="/js/register.js"></script>
</body>

</html>
